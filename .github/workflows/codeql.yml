name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: Restore
        run: dotnet restore Mietex.CosmosDb.slnx
      - name: Build
        run: dotnet build src/Mietex.CosmosDb/Mietex.CosmosDb.csproj -c Release --no-restore
      - uses: github/codeql-action/analyze@v3
