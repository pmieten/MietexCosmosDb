name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build DocFX site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install DocFX
        run: dotnet tool install docfx --tool-path .tools --version 2.81.0
      - name: Build library
        run: dotnet build src/Mietex.CosmosDb/Mietex.CosmosDb.csproj -c Release
      - name: Build documentation
        run: ./.tools/docfx docs/docfx.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
